name: Dependency Security Audit

on:
  # Run on pushes to main and PRs
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

  # Run weekly on Mondays at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  # Node.js audit
  audit-nodejs:
    name: Audit Node.js Dependencies
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated || true

      - name: Check for unused dependencies
        run: npx depcheck
        continue-on-error: true

  # Python audit
  audit-python:
    name: Audit Python Dependencies
    runs-on: ubuntu-latest
    if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install safety pip-audit

      - name: Run Safety check
        run: safety check
        continue-on-error: true

      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true

      - name: Check for outdated packages
        run: pip list --outdated

  # Ruby audit
  audit-ruby:
    name: Audit Ruby Dependencies
    runs-on: ubuntu-latest
    if: hashFiles('Gemfile') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install bundle-audit
        run: gem install bundler-audit

      - name: Update vulnerability database
        run: bundle audit update

      - name: Run bundle audit
        run: bundle audit check
        continue-on-error: true

      - name: Check for outdated gems
        run: bundle outdated

  # Rust audit
  audit-rust:
    name: Audit Rust Dependencies
    runs-on: ubuntu-latest
    if: hashFiles('Cargo.toml') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit
        continue-on-error: true

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Check for outdated crates
        run: cargo outdated

  # Go audit
  audit-go:
    name: Audit Go Dependencies
    runs-on: ubuntu-latest
    if: hashFiles('go.mod') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

      - name: Verify dependencies
        run: go mod verify

      - name: Tidy dependencies
        run: go mod tidy

  # Summary job
  audit-summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    needs: [audit-nodejs, audit-python, audit-ruby, audit-rust, audit-go]
    if: always()

    steps:
      - name: Check audit results
        run: |
          echo "Dependency audit completed"
          echo "Review the individual job outputs above for details"

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔒 Dependency security audit completed. Please review the workflow results.'
            })
